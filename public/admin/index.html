<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ALM · Site editor</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root{
    --bg:#0A0A0A;
    --ink:#F4F4F0;
    --accent:#F7F7F7;
    --accent-glow:rgba(255,255,255,0.12);
    --plate:#161616;
    --plate-hover:#1F1F1F;
    --dark:#0F0F0F;
    --l06:rgba(244,244,240,.06);
    --l10:rgba(244,244,240,.1);
    --l20:rgba(244,244,240,.2);
    --l45:rgba(244,244,240,.45);
    --l60:rgba(244,244,240,.6);
    --warn:#C8C8C8;
    --bad:#FFFFFF;
    --good:#FFFFFF;
    --r:20px;
    --rs:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;background:#0c0c0c}
  button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  a{color:inherit}
  [hidden]{display:none!important}
  ::selection{background:var(--accent);color:#000}

  /* Shared pieces */
  .cap{font-size:11px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--l45)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;background:var(--l06);font-weight:500;font-size:13px;white-space:nowrap;transition:all .15s}
  .btn:hover{background:var(--l10)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:8px}
  .btn.ghost{background:none;box-shadow:inset 0 0 0 1px var(--l10)}
  .btn.ghost:hover{background:var(--l06)}
  .btn.bad{color:var(--bad)}
  .btn.bad:hover{background:rgba(232,93,78,.15)}
  .btn.accent{background:var(--accent);color:#000;font-weight:600}
  .btn.accent:hover{filter:brightness(1.1)}
  
  .cta{display:inline-flex;gap:3px;height:42px;color:#000;font-weight:600;font-size:14px;letter-spacing:-.01em;transition:opacity .15s}
  .cta .cl{display:flex;align-items:center;padding:0 18px;border-radius:12px;background:var(--accent);white-space:nowrap}
  .cta .ca{width:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center}
  .cta:hover{opacity:.92}
  .cta:disabled{opacity:.35;cursor:default}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .lg-box{width:min(420px,100%);background:var(--plate);border-radius:24px;padding:36px 30px;box-shadow:0 24px 60px rgba(0,0,0,.6);border:1px solid var(--l06)}
  .lg-logo{font-size:38px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px;color:var(--ink)}
  .lg-logo span{color:var(--accent)}
  .lg-sub{color:var(--l60);font-size:14px;margin-bottom:28px}
  .lg-f{display:grid;gap:12px}
  .lg-err{color:var(--bad);font-size:13px;min-height:1.2em;margin-top:12px}

  /* Top bar */
  #app{display:grid;grid-template-columns:68px minmax(0,1fr);min-height:100vh}
  .app-main{min-width:0}
  .mode-rail{position:sticky;top:0;height:100vh;z-index:30;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:#121212;border-right:1px solid var(--l10)}
  .rail-logo{font-size:18px;font-weight:800;letter-spacing:-.06em;margin-bottom:24px}
  .mode-rail a{display:grid;place-items:center;width:50px;height:50px;border-radius:12px;color:var(--l60);text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.01em}
  .mode-rail button{display:grid;place-items:center;width:50px;height:50px;border-radius:12px;color:var(--l60);font-size:10px;font-weight:700;letter-spacing:.01em}
  .mode-rail a:hover{background:var(--l06);color:var(--ink)}
  .mode-rail button:hover{background:var(--l06);color:var(--ink)}
  .mode-rail a.on{background:var(--accent);color:#111}
  .mode-rail button.on{background:var(--accent);color:#111}
  .mode-rail a span:first-child{font-size:17px;line-height:1}
  .mode-rail button span:first-child{font-size:17px;line-height:1}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:12px 24px;min-height:64px;background:rgba(12,12,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--l06)}
  .top-title{font-size:15px;font-weight:650;white-space:nowrap}
  .section-bar{position:sticky;top:64px;z-index:19;background:rgba(12,12,12,.96);border-bottom:1px solid var(--l06);padding:13px 24px 15px}
  .section-label{display:block;margin-bottom:9px;color:var(--l45);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;scrollbar-color:#3b3b3b transparent}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{height:34px;padding:0 12px;border-radius:8px;background:#191919;font-size:12px;font-weight:600;color:var(--l60);white-space:nowrap;transition:all .15s}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#000}
  .acts{margin-left:auto;display:flex;align-items:center;gap:12px}
  .st{font-size:13px;color:var(--l60);white-space:nowrap;display:flex;align-items:center;gap:8px}
  .st i{width:8px;height:8px;border-radius:50%;background:var(--l20)}
  .st.dirty i{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .st.ok i{background:var(--good);box-shadow:0 0 8px var(--good)}
  .who{font-size:12px;color:var(--l45);background:var(--l06);padding:4px 10px;border-radius:20px}

  /* Layout */
  .wrap{display:grid;grid-template-columns:clamp(200px,var(--editor-width,35%),50%) 8px minmax(0,1fr);gap:10px;padding:20px 24px 80px;align-items:start}
  .ed{min-width:0;background:#151515;border:1px solid var(--l06);border-radius:16px;padding:20px}
  .pane-resizer{position:sticky;top:170px;align-self:start;height:calc(100vh - 190px);min-height:300px;border-radius:8px;cursor:col-resize;touch-action:none;background:transparent}
  .pane-resizer::before{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;border-radius:2px;background:var(--l10)}
  .pane-resizer:hover::before,.pane-resizer:focus-visible::before{background:var(--accent)}
  .pv{position:sticky;top:155px;height:calc(100vh - 170px);min-height:500px;display:flex;flex-direction:column;gap:10px}
  .pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
  .pv-address{display:flex;align-items:center;gap:9px;min-width:0;padding:8px 10px;border:1px solid var(--l10);border-radius:9px;background:#151515;color:var(--l60);font-size:12px}
  .pv-address select{max-width:210px;min-width:120px;border:0;background:#242424;padding:6px 8px;border-radius:6px;outline:0}
  .pv-address code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv-box{position:relative;flex:1;border-radius:14px;overflow:hidden;background:var(--dark);border:1px solid var(--l10)}
  .pv-box iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#000}
  .seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--dark);gap:2px}
  .seg button{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:500;color:var(--l60);white-space:nowrap}
  .seg button.on{background:var(--accent);color:#000;font-weight:600}

  /* Form & plates */
  .sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:16px 0 20px}
  .sec-h h1{margin:0;font-weight:700;font-size:25px;letter-spacing:-.03em}
  .sec-h p{margin:6px 0 0;color:var(--l60);font-size:14px}
  .plate{background:var(--plate);border-radius:var(--r);padding:22px;border:1px solid var(--l06)}
  .plate+.plate,.stack>*+*{margin-top:14px}
  .plate h2{margin:0 0 16px;font-weight:600;font-size:20px;letter-spacing:-.02em}
  .plate h3{margin:20px 0 10px;font-weight:600;font-size:15px;color:var(--ink)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
  .c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:1/-1}
  .f{display:flex;flex-direction:column;gap:6px;min-width:0}
  .f .lb{display:flex;justify-content:space-between;gap:10px}
  .f .cnt{font-size:11px;color:var(--l45);font-variant-numeric:tabular-nums}
  .f input[type=text],.f input[type=password],.f input[type=email],.f textarea{width:100%;background:var(--dark);border:0;border-radius:10px;padding:10px 12px;outline:none;box-shadow:inset 0 0 0 1px rgba(244,244,240,.08);transition:box-shadow .15s;font-size:14px}
  .f input:focus,.f textarea:focus{box-shadow:inset 0 0 0 1px var(--accent)}
  .f textarea{resize:vertical;min-height:56px;line-height:1.4}
  .hint{font-size:12px;color:var(--l45);line-height:1.35}
  .auto-fields{display:grid;gap:0}
  .auto-field{padding:15px 0;border-top:1px solid var(--l06)}
  .auto-field.selected{margin:0 -10px;padding:15px 10px;border-radius:9px;background:#232323;box-shadow:inset 3px 0 0 var(--accent)}
  .auto-field:first-child{border-top:0}
  .auto-field .cap{display:block;margin-bottom:8px;letter-spacing:0;text-transform:none;font-size:12px;color:var(--l60)}
  .auto-field input,.auto-field textarea{display:block;width:100%;padding:10px 11px;border:1px solid var(--l10);border-radius:9px;background:#0e0e0e;color:var(--ink);outline:0;resize:vertical;line-height:1.45}
  .auto-field input:focus,.auto-field textarea:focus{border-color:var(--accent)}
  .auto-field textarea{min-height:72px}
  .auto-field .hint{margin-top:6px}
  .auto-field .media-preview{width:100%;height:120px;object-fit:cover;background:#222;border-radius:8px;margin-bottom:8px}
  .auto-field .field-actions{display:flex;gap:8px;margin-top:8px}
  .field-count{margin:5px 0 16px;color:var(--l45);font-size:12px}
  .workspace-view{padding:24px;min-height:calc(100vh - 64px)}
  .media-layout{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:18px;min-height:calc(100vh - 150px)}
  .media-folders,.media-detail{background:#151515;border:1px solid var(--l06);border-radius:14px;padding:16px;min-width:0}
  .media-main{min-width:0}
  .media-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .media-head h1{margin:0;font-size:25px}
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
  .asset-tile{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;padding:8px;border:1px solid var(--l10);border-radius:11px;background:#171717;color:var(--ink)}
  .asset-tile:hover,.asset-tile.on{border-color:var(--accent)}
  .asset-tile.unused .asset-thumb{opacity:.5}
  .asset-thumb{display:grid;place-items:center;width:100%;aspect-ratio:1.25;border-radius:7px;background:#252525;overflow:hidden;color:var(--l45);font-size:25px}
  .asset-thumb img{width:100%;height:100%;object-fit:cover}
  .asset-tile span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .folder-link{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:7px;color:var(--l60);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folder-link:hover,.folder-link.on{background:var(--l10);color:var(--ink)}
  .media-detail img,.media-detail video{display:block;width:100%;max-height:180px;object-fit:contain;background:#242424;border-radius:9px;margin:12px 0}
  .media-detail h2{margin:0;font-size:17px;word-break:break-word}
  .media-detail .auto-field{padding:12px 0}
  .media-detail .hint{word-break:break-all}
  .picker-grid{max-height:50vh;overflow:auto}
  .settings-view{max-width:760px;margin:auto}
  .settings-view h1{font-size:27px;margin:0 0 16px}
  .settings-group{background:#151515;border:1px solid var(--l06);border-radius:14px;padding:20px;margin:14px 0}
  .settings-group h2{font-size:16px;margin:0 0 10px}
  @media(max-width:1100px){.wrap{grid-template-columns:1fr}.pane-resizer{display:none}.pv{position:relative;top:auto;height:620px}.ed{order:2}.pv{order:1}.media-layout{grid-template-columns:170px minmax(0,1fr)}.media-detail{grid-column:1/-1}}
  @media(max-width:700px){#app{grid-template-columns:54px minmax(0,1fr)}.mode-rail{padding:12px 2px}.mode-rail a,.mode-rail button{width:46px}.top{padding:10px 14px;flex-wrap:wrap}.section-bar{position:relative;top:auto;padding:12px 14px}.wrap{padding:14px;gap:14px}.acts{gap:6px}.who{display:none}.st span{display:none}.pv{height:460px;min-height:0}.media-layout{display:block}.media-folders,.media-detail{margin:12px 0}.workspace-view{padding:14px}}

  /* Items lists */
  .items{display:flex;flex-direction:column;gap:8px}
  .it{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--dark);cursor:pointer;transition:all .15s;border:1px solid transparent}
  .it:hover{background:var(--plate-hover);border-color:var(--l10)}
  .it.on{border-color:var(--accent)}
  .it .no{font-size:12px;color:var(--l45);font-variant-numeric:tabular-nums;width:24px}
  .it .th{width:50px;height:40px;border-radius:8px;background:#222 center/cover;flex:none}
  .it .tt{flex:1;min-width:0}
  .it .tt b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it .tt span{font-size:12px;color:var(--l60);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it .ops{display:flex;gap:4px}

  /* Media field */
  .media{display:flex;gap:16px;align-items:flex-start}
  .ph-box{width:140px;height:95px;border-radius:10px;background:#222 center/cover no-repeat;flex:none;overflow:hidden;border:1px solid var(--l10);position:relative}
  .ph-box .em{position:absolute;inset:0;display:grid;place-items:center;color:var(--l45);font-size:11px;text-align:center;padding:8px}
  .drop{border-radius:12px;box-shadow:inset 0 0 0 1px var(--l20);padding:12px;color:var(--l60);font-size:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1}
  .bar{height:4px;border-radius:2px;background:var(--l10);overflow:hidden;width:100%}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

  /* Modal */
  .mod{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}
  .mod-c{width:min(580px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--plate);border-radius:24px;padding:30px;border:1px solid var(--l10)}
  .mod-c h2{margin:0 0 12px;font-size:28px;font-weight:700;letter-spacing:-.03em}
  .mod-f{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
  .steps{display:grid;gap:12px;margin:20px 0}
  .steps div{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--l60)}
  .steps div i{width:10px;height:10px;border-radius:50%;background:var(--l20)}
  .steps div.on{color:var(--ink)} .steps div.on i{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .steps div.ok{color:var(--good)} .steps div.ok i{background:var(--good)}

  /* Toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#000;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s}
  #toast.bad{background:var(--bad);color:#fff}
  #toast.bad{color:#111}
  /* Monochrome workspace */
  .ui-icon{display:inline-block;width:19px;height:19px;flex:none;background:currentColor;mask:var(--icon) center/contain no-repeat;-webkit-mask:var(--icon) center/contain no-repeat}
  #app{grid-template-columns:76px minmax(0,1fr)}
  .mode-rail{background:#fff;color:#141414;border:0;border-radius:26px;margin:10px 0 10px 10px;height:calc(100vh - 20px);padding:18px 10px;gap:7px;box-shadow:0 12px 50px #0005}
  .rail-logo{display:grid;place-items:center;width:42px;height:42px;margin:0 0 25px;font-size:23px;font-weight:800;color:#111}
  .mode-rail button,.mode-rail a{width:46px;height:46px;border-radius:13px;color:#555;background:transparent}
  .mode-rail button:hover,.mode-rail a:hover{background:#eee;color:#111}
  .mode-rail button.on,.mode-rail a.on{background:#161616;color:#fff}
  .mode-rail .rail-logout{margin-top:auto;border-top:1px solid #e5e5e5;border-radius:0;padding-top:13px;height:58px}
  .top{background:#0b0b0b;padding:15px 28px;min-height:70px;border-bottom:1px solid #252525}
  .top-title{font-size:18px;letter-spacing:-.03em}
  .acts{gap:10px}
  .st{font-size:12px;color:#999}.st i,.st.dirty i,.st.ok i{background:#aaa;box-shadow:none}
  .history-actions{display:flex;gap:4px;margin:0 4px}
  .icon-btn{display:grid;place-items:center;flex:none;width:34px;height:34px;border:1px solid #303030;border-radius:9px;color:#ccc;text-decoration:none;background:#161616}
  .icon-btn:hover,.icon-btn.active{background:#f3f3f3;color:#111;border-color:#f3f3f3}
  .icon-btn:disabled{opacity:.35;cursor:default;background:#161616;color:#aaa;border-color:#303030}
  .cta{height:38px;gap:0}.cta .cl{background:#f4f4f4;color:#101010;border-radius:9px;padding:0 17px;font-size:13px}.cta .ca{display:none}
  .wrap{padding:20px 26px 60px;gap:12px}
  .ed{background:#101010;border:1px solid #252525;border-radius:15px;padding:20px}
  .pv{top:90px;height:calc(100vh - 112px);min-height:460px;gap:9px}
  .pane-resizer{top:90px;height:calc(100vh - 112px)}
  .pv-address{display:flex;gap:8px;width:100%;padding:6px 7px 6px 11px;background:#151515;border-color:#303030;color:#ddd}
  .pv-address select{min-width:130px;max-width:220px;background:#222;border:0;color:#fff;font-size:12px;font-weight:600;padding:7px 9px}
  .pv-address code{flex:1;min-width:0;font-family:inherit;font-size:12px;color:#999}
  .pv-address .icon-btn{width:30px;height:30px;background:transparent;border:0}.pv-address .icon-btn:hover{background:#333;color:#fff}
  .section-bar{position:static;background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;min-height:34px}
  .section-label{margin:0;color:#999;letter-spacing:.07em;white-space:nowrap}
  .section-bar select{min-width:0;max-width:100%;width:min(360px,100%);height:33px;border:1px solid #303030;border-radius:8px;background:#191919;color:#f4f4f4;padding:0 9px;font-size:12px;outline:0}
  .pv-bar{justify-content:flex-end;gap:8px}.pv-bar .hint{margin-right:auto;font-size:11px}
  .seg{border:1px solid #303030;background:#151515;padding:2px;border-radius:9px}.seg button{display:grid;place-items:center;width:30px;height:29px;padding:0}.seg button.on{background:#f4f4f4;color:#111}
  .pv-box{border-radius:11px;border-color:#303030}
  .sec-h{margin:0 0 12px}.sec-h h1{font-size:20px}.field-count{font-size:11px;margin:0 0 12px}
  .auto-field{padding:12px 0}.auto-field.selected{background:#232323;box-shadow:inset 3px 0 0 #fff}
  .auto-field input,.auto-field textarea{background:#171717;border-color:#333}.auto-field input:focus,.auto-field textarea:focus{border-color:#fff}
  .plate,.settings-group,.media-folders,.media-detail{background:#141414;border-color:#292929;border-radius:12px}
  .asset-tile{background:#171717}.asset-tile:hover,.asset-tile.on{border-color:#fff}
  .btn.bad{color:#fff}.btn.bad:hover{background:#333}
  .lg-box{border-radius:16px}.lg-logo span{color:#fff}
  .st.dirty{color:#fff}.st.ok{color:#999}
  .steps div.ok{color:#fff}.steps div.ok i{background:#fff}
  .settings-view{max-width:none}
  .const-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
  .const-badge{display:inline-flex;align-items:center;gap:5px;border:1px solid #777;border-radius:5px;padding:3px 6px;color:#fff;background:#303030;font-size:10px;letter-spacing:.08em;font-weight:700;text-transform:uppercase}
  .const-badge .ui-icon{width:12px;height:12px}
  .const-value{font-size:14px;word-break:break-word;color:#fff}
  .const-note{font-size:11px;color:#aaa;margin-top:6px}
  .const-list{display:grid;gap:6px;margin:18px 0}
  .const-list button{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #292929;border-radius:9px;background:#171717;text-align:left}
  .const-list button.on,.const-list button:hover{border-color:#eee;background:#242424}
  .const-list button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aaa;font-size:11px}

  .const-detail .auto-field{border:0}
  .input-shell{position:relative;min-width:0;width:100%}
  .input-shell input,.input-shell textarea{padding-right:43px!important}
  .input-shell[data-bound] input,.input-shell[data-bound] textarea{border-style:dashed;cursor:pointer}
  .input-const{position:absolute;right:5px;top:5px;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:#888;opacity:.45;transition:opacity .15s,background .15s,color .15s}
  .input-shell:hover .input-const,.input-shell:focus-within .input-const{opacity:1}
  .input-const:hover,.input-shell[data-bound] .input-const{color:#fff;background:#333;opacity:1}
  .input-const .ui-icon{width:17px;height:17px}
  .input-auto{position:absolute;right:10px;top:12px;font-size:10px;color:#aaa;font-weight:700;letter-spacing:.06em;pointer-events:none}
  .link-editor{display:grid;gap:10px;padding:12px;border:1px solid #303030;border-radius:10px;background:#141414}
  .link-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px;align-items:center}
  .link-row>span{font-size:11px;color:#999}
  .link-row select{width:100%;min-width:0;padding:9px 10px;border:1px solid #333;border-radius:8px;background:#1b1b1b;color:#eee;outline:0}
  .link-row .seg{display:flex}.link-row .seg button{width:auto;flex:1;font-size:11px}
  .section-bar{min-width:0;overflow:hidden}
  .tabs{display:flex;flex:1;min-width:0;gap:5px;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;height:31px;padding:0 11px;border:1px solid transparent;background:#191919;font-size:11px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
  .tabs button.on{background:#f4f4f4;color:#111}
  @media(max-width:1100px){.pv{top:auto;height:600px}.pane-resizer{display:none}}
  @media(max-width:700px){#app{grid-template-columns:58px minmax(0,1fr)}.mode-rail{margin:5px 0 5px 5px;height:calc(100vh - 10px);padding:10px 4px;border-radius:17px}.mode-rail button,.mode-rail a{width:42px;height:42px}.top{padding:11px 13px;gap:8px}.top-title{font-size:14px}.st span{display:none}.history-actions{margin:0}.wrap{padding:12px}.pv{height:470px}.pv-address code{display:none}.pv-bar .hint{display:none}}

.inspector-back{display:inline-flex;align-items:center;padding:8px 0;margin-bottom:18px;color:#aaa;background:none;border:0;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}.inspector-back:hover{color:#fff}.inspector-eyebrow{font-size:10px;letter-spacing:1.4px;color:#65d48a;margin:0 0 24px}.element-list{display:grid;gap:8px;margin:20px 0}.element-card,.collection-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1px solid #303030;border-radius:10px;background:#171717;color:#eee;text-align:left;cursor:pointer;font:inherit;transition:border-color .15s,background .15s}.element-card:hover{border-color:#4caf70;background:#1b211d}.element-card img{width:48px;height:44px;object-fit:cover;border-radius:5px;background:#252525}.element-symbol{width:32px;color:#75d995;font-size:22px;text-align:center}.element-copy{flex:1;min-width:0}.element-copy small{display:block;color:#929292;font-size:10px;margin-bottom:5px}.element-copy strong{display:block;font-size:12px;font-weight:500;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.collection-card{margin-bottom:8px;flex-direction:column;align-items:flex-start;background:#191c21;border-color:#313a48}.collection-card:hover{border-color:#718ec2}.collection-card small{color:#99a8c1;font-size:11px}.record-list{display:grid;gap:8px;margin-top:16px}.record-card{display:flex;align-items:center;border:1px solid #333;border-radius:9px;background:#171717;padding:8px;gap:6px}.record-card:hover{border-color:#596b8c}.record-card.dragging{opacity:.35}.drag-grip{cursor:grab;color:#666;font-size:22px}.record-open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;color:#eee;font:inherit;text-align:left;cursor:pointer;padding:7px}.record-open small{color:#777;font-size:10px}.record-open strong{flex:1;font-size:12px;font-weight:500;line-height:1.5}.record-order{display:flex;flex-direction:column;gap:3px}.record-order button{background:#222;border:1px solid #383838;border-radius:4px;color:#ccc;cursor:pointer;padding:2px 6px}.record-order button:disabled{opacity:.25;cursor:default}
</style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="login" class="login">
  <div class="lg-box">
    <div class="lg-logo">ALM<span>.</span></div>
    <div class="lg-sub">ALM site content editor</div>
    <form id="pwForm" class="lg-f">
      <div class="f">
        <span class="cap">Username</span>
        <input type="text" name="user" required autocomplete="username" placeholder="admin" autofocus>
      </div>
      <div class="f">
        <span class="cap">Password</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn accent" style="height:44px;margin-top:8px;">Sign in</button>
      <div id="lgErr" class="lg-err"></div>
    </form>
    <div id="lgSetup" class="hint" style="margin-top:16px;">
      Set your local username and password in <code>.env.local</code>.
    </div>
  </div>
</div>

<!-- 2. MAIN APP -->
<div id="app" hidden>
  <aside class="mode-rail" aria-label="Workspace navigation">
    <div class="rail-logo" aria-label="ALM">A</div>
    <button id="modeAdmin" class="on" type="button" title="Page editor" aria-label="Page editor"><span class="ui-icon" data-icon="panels-top-left"></span></button>
    <button id="modeCms" type="button" title="CMS collections" aria-label="CMS collections"><span class="ui-icon" data-icon="files"></span></button>
    <button id="modeMedia" type="button" title="Media library" aria-label="Media library"><span class="ui-icon" data-icon="images"></span></button>
    <button id="modeConst" type="button" title="Const variables" aria-label="Const variables"><span class="ui-icon" data-icon="variable"></span></button>
    <button id="modeSettings" type="button" title="Page settings" aria-label="Page settings"><span class="ui-icon" data-icon="settings-2"></span></button>
    <button id="bOut" class="rail-logout" type="button" title="Log out" aria-label="Log out"><span class="ui-icon" data-icon="log-out"></span></button>
  </aside>
  <div class="app-main">
  <header class="top">
    <div class="top-title">Page editor</div>
    <div class="acts">
      <div id="st" class="st"><i aria-hidden="true"></i><span>Loading…</span></div>
      <div class="history-actions"><button id="undo" class="icon-btn" type="button" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><span class="ui-icon" data-icon="undo-2"></span></button><button id="redo" class="icon-btn" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo"><span class="ui-icon" data-icon="redo-2"></span></button></div>
      <button id="bPub" class="cta" disabled>
        <span class="cl">Publish</span>
      </button>
    </div>
  </header>
  <div id="tokenWarn" style="display:none;background:#1b1b1b;color:#f4f4f4;padding:10px 24px;font-size:13px;border-bottom:1px solid #444;align-items:center;gap:10px;">
    <span>Remote publishing is not configured. Edit static content locally with <code>npm run dev:cms</code>.</span>
  </div>
  <main id="adminWorkspace" class="wrap">
    <!-- Editor Column -->
    <div id="ed" class="ed"></div>
    <div id="paneResizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="Editor width" tabindex="0"></div>

    <!-- Live Preview Column -->
    <div class="pv">
      <div class="pv-address"><span class="ui-icon" data-icon="globe-2"></span><select id="pageSelect" aria-label="Choose page"></select><code id="pageUrl">http://127.0.0.1:3001/</code><button id="pvRe" class="icon-btn" type="button" title="Reload preview" aria-label="Reload preview"><span class="ui-icon" data-icon="rotate-cw"></span></button><a id="pvOpen" href="/" target="_blank" class="icon-btn" title="Open page" aria-label="Open page"><span class="ui-icon" data-icon="external-link"></span></a></div>
      <nav id="sectionBar" class="section-bar" aria-label="Page sections"><span class="section-label">Sections</span><div id="tabs" class="tabs" role="tablist"></div></nav>
      <div class="pv-bar">
        <div id="dev" class="seg">
          <button type="button" class="on" data-d="desk" title="Desktop" aria-label="Desktop"><span class="ui-icon" data-icon="monitor"></span></button>
          <button type="button" data-d="tab" title="Tablet" aria-label="Tablet"><span class="ui-icon" data-icon="tablet"></span></button>
          <button type="button" data-d="ph" title="Phone" aria-label="Phone"><span class="ui-icon" data-icon="smartphone"></span></button>
        </div>
        <button id="pvClicks" type="button" class="icon-btn active" aria-pressed="true" title="Preview links disabled" aria-label="Toggle preview links"><span class="ui-icon" data-icon="mouse-pointer-click"></span></button>
      </div>
      <div id="pvBox" class="pv-box">
        <iframe id="pvF" src="/?cms-preview=1" title="Draft preview"></iframe>
      </div>
    </div>
  </main>
  <div id="workspaceView" class="workspace-view" hidden></div>
  </div>
</div>

<!-- Modal Container -->
<div id="mod" class="mod" hidden>
  <div id="modC" class="mod-c"></div>
</div>

<!-- Toast -->
<div id="toast" hidden></div>

<script src="/admin/content-structure.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('[data-icon]').forEach(el => el.style.setProperty('--icon', `url('/admin/icons/${el.dataset.icon}.svg')`));
  const h = (tag, attrs, ...children) => {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (v !== null && v !== undefined) el.setAttribute(k, v);
      }
    }
    for (const c of children.flat()) {
      if (c == null) continue;
      el.append(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
    }
    return el;
  };
  const clone = o => JSON.parse(JSON.stringify(o));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg;
    t.className = bad ? 'bad' : '';
    t.hidden = false;
    clearTimeout(toast.T);
    toast.T = setTimeout(() => t.hidden = true, 3000);
  }

  /* API Client */
  async function api(op, body = {}) {
    const isGet = ['content', 'history', 'manifest', 'me', 'media-list', 'pages-list'].includes(op);
    const url = '/api/admin?op=' + encodeURIComponent(op);
    const opts = {
      method: isGet ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json' }
    };
    if (!isGet) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const fields = Array.isArray(data.details)
        ? data.details.slice(0, 3).map(item => `${item.path.join('.')}: ${item.message}`).join('; ')
        : '';
      throw new Error(fields || data.message || 'Request failed: ' + res.status);
    }
    return data;
  }

  /* State */
  const S = {
    me: '',
    sha: '',
    draftRevision: null,
    pub: null,
    c: null,
    tab: null,
    sections: [],
    activeField: null,
    activeGroup: null,
    collectionKey: null,
    collectionItem: null,
    mode: 'admin',
    media: null,
    mediaFolder: '/assets',
    selectedAsset: null,
    constKey: null,
    page: '/',
    pages: [],
    dev: 'desk',
    blockPreviewClicks: true
  };
  const LS = 'alm.admin.draft';
  const strip = c => { const o = clone(c); delete o.pub; return o; };
  const dirty = () => S.pub && S.c && !same(strip(S.c), strip(S.pub));
  const constRef = value => {
    const match = typeof value === 'string' && /^\{\{const\.([a-z][a-zA-Z0-9]*)(?:\|(tel|mailto))?\}\}$/.exec(value.trim());
    return match ? { key: match[1], format: match[2] || null } : null;
  };
  const constToken = (key, format) => `{{const.${key}${format ? `|${format}` : ''}}}`;
  const resolveConst = value => {
    const ref = constRef(value);
    if (!ref) return value;
    const text = S.c?.consts?.[ref.key]?.value;
    if (typeof text !== 'string') return value;
    if (ref.format === 'tel') return `tel:${text.replace(/[^+\d]/g, '')}`;
    if (ref.format === 'mailto') return `mailto:${text.trim()}`;
    return text;
  };
  function constUsage(key) {
    let count = 0;
    const walk = value => {
      if (typeof value === 'string') { if (constRef(value)?.key === key) count++; }
      else if (Array.isArray(value)) value.forEach(walk);
      else if (value && typeof value === 'object') Object.values(value).forEach(walk);
    };
    for (const [name, value] of Object.entries(S.c || {})) if (name !== 'consts') walk(value);
    return count;
  }
  const history = { undo: [], redo: [], key: '', at: 0, busy: false };
  function updateHistoryButtons() {
    $('undo').disabled = history.busy || !history.undo.length;
    $('redo').disabled = history.busy || !history.redo.length;
  }
  function recordChange(key) {
    if (!S.c) return;
    const now = Date.now();
    if (key !== history.key || now - history.at > 850) {
      history.undo.push({ kind: 'content', content: clone(S.c) });
      if (history.undo.length > 100) history.undo.shift();
    }
    history.key = key;
    history.at = now;
    history.redo.length = 0;
    updateHistoryButtons();
  }
  function recordMediaChange(url, before, after) {
    recordAction({ kind: 'media', url, before, after });
  }
  function recordAction(action) {
    history.undo.push(action);
    if (history.undo.length > 100) history.undo.shift();
    history.redo.length = 0;
    history.key = '';
    updateHistoryButtons();
  }
  async function applyHistory(direction) {
    const source = history[direction];
    if (!source.length || !S.c || history.busy) return;
    history.busy = true;
    updateHistoryButtons();
    const target = direction === 'undo' ? history.redo : history.undo;
    const entry = source.at(-1);
    if (entry.kind === 'replace' || entry.kind === 'upload' || entry.kind === 'folder') {
      try {
        if (entry.kind === 'replace') {
          const result = await api('media-swap-backup', { url: entry.url, backup: entry.backup });
          entry.backup = result.backup;
        } else if (entry.kind === 'upload') {
          if (direction === 'undo') {
            const result = await api('media-stash', { url: entry.url });
            entry.token = result.token;
            entry.metadata = result.metadata;
          } else await api('media-unstash', { url: entry.url, token: entry.token, metadata: entry.metadata });
        } else if (direction === 'undo') await api('media-folder-remove', { folder: entry.folder });
        else await api('media-folder', { parent: entry.parent, name: entry.name });
        source.pop(); target.push(entry);
        await loadMedia();
        if (S.mode === 'media') renderMedia();
        preview();
        toast(direction === 'undo' ? 'Change undone' : 'Change redone');
      } catch (error) { toast(error.message, true); }
      history.busy = false;
      updateHistoryButtons();
      return;
    }
    if (entry.kind === 'media') {
      try {
        await api('media-update', { url: entry.url, ...(direction === 'undo' ? entry.before : entry.after) });
        source.pop(); target.push(entry);
        await loadMedia();
        if (S.mode === 'media') renderMedia();
        toast(direction === 'undo' ? 'Media change undone' : 'Media change redone');
      } catch (error) { toast(error.message, true); }
      history.busy = false;
      updateHistoryButtons();
      return;
    }
    target.push({ kind: 'content', content: clone(S.c) });
    S.c = source.pop().content;
    history.key = '';
    changed();
    if (S.mode === 'settings') renderPageSettings();
    else if (S.mode === 'media') renderMedia();
    else if (S.mode === 'const') renderConst();
    else if (S.mode === 'cms') renderCollections();
    else render();
    history.busy = false;
    updateHistoryButtons();
  }
  $('undo').addEventListener('click', () => applyHistory('undo'));
  $('redo').addEventListener('click', () => applyHistory('redo'));
  document.addEventListener('keydown', event => {
    if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
    const key = event.key.toLowerCase();
    if (key !== 'z' && key !== 'y') return;
    event.preventDefault();
    applyHistory(key === 'y' || event.shiftKey ? 'redo' : 'undo');
  });
  updateHistoryButtons();
  function get(path) { return path.reduce((o, k) => o == null ? o : o[k], S.c); }
  function set(path, val) {
    if (same(get(path), val)) return;
    recordChange('content:' + path.join('.'));
    let o = S.c;
    for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
    o[path[path.length - 1]] = val;
    changed();
  }

  let saveT = 0, saveChain = Promise.resolve();
  function saveDraftNow() {
    clearTimeout(saveT);
    const content = clone(S.c);
    saveChain = saveChain.catch(() => {}).then(async () => {
      const r = await api('save-draft', { content, expectedDraftRevision: S.draftRevision });
      S.draftRevision = r.draftRevision;
      try { localStorage.removeItem(LS); } catch (e) {}
    });
    return saveChain;
  }
  function changed() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      try { localStorage.setItem(LS, JSON.stringify({ c: S.c, sha: S.sha, at: Date.now() })); } catch (e) {}
      saveDraftNow().catch(err => toast('Draft was not saved: ' + err.message, true));
    }, 500);
    status();
    preview();
  }

  function preview() {
    if (S.c) {
      $('pvF').contentWindow?.postMessage({ type: 'CMS_DRAFT_UPDATE', content: S.c, pages: S.pages, blockClicks: S.blockPreviewClicks }, location.origin);
      if (S.mode === 'const') $('pvF').contentWindow?.postMessage({ type: 'CMS_HIGHLIGHT_CONST', key: S.constKey }, location.origin);
    }
  }
  $('pvF').addEventListener('load', () => {
    try {
      const path = $('pvF').contentWindow.location.pathname;
      if (path !== S.page && S.pages.some(page => page.path === path)) {
        S.page = path;
        S.sections = [];
        S.tab = null;
        S.activeField = null;
        $('pageSelect').value = path;
        $('pageUrl').textContent = location.origin + path;
        $('pvOpen').href = path;
        if (S.mode === 'admin') render();
      }
    } catch { /* The preview can navigate to an external site. */ }
    preview();
  });
  addEventListener('message', event => {
    if (event.origin !== location.origin || event.source !== $('pvF').contentWindow) return;
    if (event.data?.type === 'CMS_PREVIEW_READY') preview();
    if (event.data?.type === 'CMS_STRUCTURE' && event.data.page === S.page && Array.isArray(event.data.sections)) {
      S.sections = event.data.sections;
      if (!S.sections.some(section => section.id === S.tab)) S.tab = S.sections[0]?.id || null;
      if (S.mode === 'admin') render();
      if (S.mode === 'cms') renderCollections();
      return;
    }
    if (event.data?.type === 'CMS_ACTIVE_SECTION' && event.data.page === S.page && S.sections.some(section => section.id === event.data.id)) {
      if (S.tab !== event.data.id) {
        S.tab = event.data.id;
        S.activeGroup = null;
        if (S.mode === 'admin') render();
      }
      return;
    }
    if (event.data?.type === 'CMS_GROUP_FOCUS' && typeof event.data.id === 'string') {
      const section = S.sections.find(section => section.fields.some(field => field.groupId === event.data.id));
      if (!section) return;
      const fields = section.fields.filter(field => field.groupId === event.data.id);
      const path = fields.map(CMSStructure.arrayPath).find(Boolean);
      if (path) {
        S.collectionKey = path.join('.');
        S.collectionItem = fields.find(field => CMSStructure.arrayPath(field))?.path[path.length] ?? null;
        setMode('cms');
      } else {
        S.tab = section.id;
        S.activeGroup = event.data.id;
        setMode('admin');
      }
      $('pvF').contentWindow?.postMessage({ type: 'CMS_SELECT_GROUP', id: event.data.id }, location.origin);
      return;
    }
    if (event.data?.type === 'CMS_FIELD_FOCUS' && typeof event.data.id === 'string') {
      selectField(event.data.id, false);
      return;
    }
    if (event.data?.type === 'CMS_CONST_FOCUS' && typeof event.data.key === 'string') {
      S.constKey = event.data.key;
      setMode('const');
      return;
    }
    if (event.data?.type === 'CMS_STATIC_EDIT' && S.c) {
      const { key, base, value, page } = event.data;
      if (page !== S.page) return;
      if (typeof key !== 'string' || key.length > 250 || typeof base !== 'string' || typeof value !== 'string' || value.length > 5000) return;
      recordChange('static:' + page + ':' + key);
      const content = page === '/' ? S.c : ((S.c.pageOverrides ||= {})[page] ||= {});
      content.staticText ||= {};
      if (value === base) delete content.staticText[key];
      else content.staticText[key] = { base, value };
      changed();
      const section = S.sections.find(item => item.fields.some(field => field.source === 'staticText' && field.key === key));
      if (section) S.tab = section.id;
      if (S.mode !== 'admin') setMode('admin');
      render();
      return;
    }
    if (event.data?.type !== 'CMS_INLINE_EDIT' || !Array.isArray(event.data.path) || !S.c) return;
    const path = event.data.path;
    const section = S.sections.find(item => item.fields.some(field => field.source === 'content' && JSON.stringify(field.path) === JSON.stringify(path)));
    if (!section) return;
    set(path, event.data.value);
    S.tab = section.id;
    if (S.mode !== 'admin') setMode('admin');
    render();
  });

  function status() {
    const e = $('st'), d = dirty();
    e.classList.toggle('dirty', d);
    e.classList.toggle('ok', !d);
    e.lastChild.textContent = d ? 'Unpublished changes' : 'Published locally';
    $('bPub').disabled = !d;
  }

  function fitPreview() {
    const pvBox = $('pvBox'), pvF = $('pvF');
    const W = pvBox.clientWidth, H = pvBox.clientHeight;
    if (!W || !H) return;
    if (S.dev === 'desk') {
      const k = Math.min(W / 1920, H / 1080);
      Object.assign(pvF.style, {

  /* Client-side image optimization: Canvas -> WebP compression */
  function processImage(file, max = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > max || h > max) {
          if (w > h) {
            h = Math.round((h * max) / w);
            w = max;
          } else {
            w = Math.round((w * max) / h);
            h = max;
          }
        }
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        cv.toBlob(blob => {
          if (!blob) return reject(new Error('Could not optimize image'));
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result.split(',')[1];
            resolve({ base64, ext: 'webp' });
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }, 'image/webp', quality);
      };
      img.onerror = () => reject(new Error('Could not open file'));
      img.src = URL.createObjectURL(file);
    });
  }

  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.readAsDataURL(file);
    });
  }

  function replacementBase64(file, asset) {
    const extension = asset.url.split('.').at(-1).toLowerCase();
    if (extension === 'mp4') {
      if (file.type !== 'video/mp4') throw new Error('MP4 video required');
      return readFileBase64(file);
    }
    const mime = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' }[extension];
    if (!mime || !file.type.startsWith('image/')) throw new Error('This format cannot be replaced');
    return new Promise((resolve, reject) => {
      const image = new Image();
      const objectUrl = URL.createObjectURL(file);
      image.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          canvas.getContext('2d').drawImage(image, 0, 0);
          canvas.toBlob(async blob => {
            URL.revokeObjectURL(objectUrl);
            if (!blob) return reject(new Error('Could not prepare image'));
            try { resolve(await readFileBase64(blob)); } catch (error) { reject(error); }
          }, mime, .9);
        } catch (error) { URL.revokeObjectURL(objectUrl); reject(error); }
      };
      image.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Image could not be opened')); };
      image.src = objectUrl;
    });
  }

    recordAction({ kind: 'upload', url: result.url, metadata: result.metadata, token: null });
    await loadMedia();
    return result.url;
  }

  function tabs() {
    const container = $('tabs');
    const previousScroll = container.scrollLeft;
    const sections = S.sections || [];
    container.replaceChildren(...sections.map((section, index) => h('button', {
      type: 'button', role: 'tab', 'aria-selected': String(S.tab === section.id), class: S.tab === section.id ? 'on' : '',

      }
    }, `${String(index + 1).padStart(2, '0')} · ${section.label}`)));
    container.scrollLeft = previousScroll;
    const active = container.querySelector('.on');
    if (active) {
      const left = active.offsetLeft - container.offsetLeft;
      if (left < container.scrollLeft) container.scrollLeft = left;
      else if (left + active.offsetWidth > container.scrollLeft + container.clientWidth) container.scrollLeft = left + active.offsetWidth - container.clientWidth;

  $('tabs').addEventListener('wheel', event => {

  function extraContentFields(section) {
    const contentKey = section.contentKey;
    const sectionData = contentKey && S.c?.sections?.[contentKey];
    if (!sectionData) return [];
    const bound = new Set(section.fields.filter(field => field.source === 'content').map(field => field.path.join('.')));
    const result = [];
    const visit = (value, path) => {
      if (typeof value === 'string') {
        if (bound.has(path.join('.')) || ['id'].includes(String(path.at(-1)))) return;
        const key = String(path.at(-1));
        const mode = /^\/assets\//.test(value) ? 'src' : /href|link|url/i.test(key) ? 'href' : 'text';
        result.push({ id: `content:${path.join('.')}:${mode}`, source: 'content', path, mode,
          label: path.slice(2).join(' · ').replace(/([a-z])([A-Z])/g, '$1 $2'),
          value, htmlLines: /<br\s*\/?\s*>/i.test(value), mediaType: /\.(mp4|webm)(\?|$)/i.test(value) ? 'video' : 'image' });
      } else if (Array.isArray(value)) value.forEach((item, index) => visit(item, [...path, index]));
      else if (value && typeof value === 'object') {
        for (const [key, item] of Object.entries(value)) if (key !== 'id' && key !== 'active') visit(item, [...path, key]);
      }
    };
    visit(sectionData, ['sections', contentKey]);
    return result;
  }

  function backButton(label, action) {

  function elementCard(group, action) {

  }
  function moveCollectionItem(collection, from, to) {
    if (from === to || from < 0 || to < 0 || from >= collection.items.length || to >= collection.items.length) return;
    // Keep link overrides attached to the record when its array position changes.
    recordChange('collection:move:' + collection.key + ':' + Date.now());
    const permutation = collection.items.map((_, index) => index);
    permutation.splice(to, 0, permutation.splice(from, 1)[0]);
    const next = permutation.map(index => collection.items[index]);
    const remapped = {};
    for (const [key, config] of Object.entries(S.c.linkSettings || {})) {
      const prefix = collection.path;
      if (config.source === 'content' && config.path?.slice(0, prefix.length).join('.') === collection.key && typeof config.path[prefix.length] === 'number') {
        const path = [...config.path]; path[prefix.length] = permutation.indexOf(path[prefix.length]);
        const id = `content:${path.join('.')}:href`;
        remapped[`${config.page}|${id}`] = { ...config, path };
      } else remapped[key] = config;
    }
    S.c.linkSettings = remapped;
    let owner = S.c; for (const key of collection.path.slice(0, -1)) owner = owner[key];
    owner[collection.path.at(-1)] = next;
    S.collectionItem = null;
    changed(); renderCollections();
  }
  function renderCollections() {
    if (!S.c) return;
    const collections = CMSStructure.collections(S.c, S.sections);
    const collection = collections.find(item => item.key === S.collectionKey);
    const head = h('div', { class: 'sec-h' }, h('h1', null, collection ? collection.label : 'Collections'));
    if (!collection) {
      S.collectionItem = null;
      $('ed').replaceChildren(head, h('p', { class: 'hint' }, 'Repeated content, one source. Select a collection, then open a record.'),

    const back = backButton('All collections', () => { S.collectionKey = null; S.collectionItem = null; renderCollections(); });
    const item = S.collectionItem !== null && collection.items[S.collectionItem];
    if (item) {

        ...CMSStructure.itemFields(item, [...collection.path, S.collectionItem]).map(editorField));

    }
    const search = h('input', { type: 'search', placeholder: 'Search records…', 'aria-label': 'Search records' });
    const list = h('div', { class: 'record-list' });
    const draw = () => {
      list.replaceChildren(...collection.items.flatMap((item, index) => {
        const label = CMSStructure.itemTitle(item, index);
        if (!label.toLowerCase().includes(search.value.toLowerCase())) return [];
        const row = h('div', { class: 'record-card', draggable: 'true', 'data-index': index });
        row.addEventListener('dragstart', event => { event.dataTransfer.setData('text/plain', `${collection.key}|${index}`); event.dataTransfer.effectAllowed = 'move'; row.classList.add('dragging'); });
        row.addEventListener('dragend', () => row.classList.remove('dragging'));
        row.addEventListener('dragover', event => { event.preventDefault(); event.dataTransfer.dropEffect = 'move'; });
        row.addEventListener('drop', event => {
          event.preventDefault(); const [key, from] = event.dataTransfer.getData('text/plain').split('|');
          if (key === collection.key) moveCollectionItem(collection, Number(from), index);
        });
        row.append(h('span', { class: 'drag-grip', title: 'Drag to reorder' }, '⠿'),
          h('button', { class: 'record-open', type: 'button', onclick: () => { S.collectionItem = index; renderCollections(); } },
            h('small', null, String(index + 1).padStart(2, '0')), h('strong', null, label), h('span', null, '›')),
          h('div', { class: 'record-order' },
            h('button', { type: 'button', 'aria-label': `Move ${label} up`, ...(index === 0 ? { disabled: '' } : {}), onclick: () => moveCollectionItem(collection, index, index - 1) }, '↑'),
            h('button', { type: 'button', 'aria-label': `Move ${label} down`, ...(index === collection.items.length - 1 ? { disabled: '' } : {}), onclick: () => moveCollectionItem(collection, index, index + 1) }, '↓')));
        return [row];
      }));
      if (!list.childElementCount) list.append(h('p', { class: 'hint' }, 'No records found.'));
    };
    search.addEventListener('input', draw); draw();
    $('ed').replaceChildren(back, head, h('p', { class: 'hint' }, `${collection.items.length} records · Drag to reorder or use the arrows. Open a card to edit.`), search, list);
    status();
  }

        h('div', { class: 'auto-field' }, h('span', { class: 'cap' }, 'Social image'),
          image ? h('img', { class: 'media-preview', src: image, alt: '' }) : h('p', { class: 'hint' }, 'Not selected'),
          h('div', { class: 'field-actions' },
            h('button', { class: 'btn sm ghost', type: 'button', onclick: () => openMediaPicker({ source: 'pageSetting', key: 'ogImage', mode: 'src', mediaType: 'image', label: 'Open Graph image' }) }, 'Replace image…'),
            image ? h('button', { class: 'btn sm ghost', type: 'button', onclick: () => { writeField({ source: 'pageSetting', key: 'ogImage' }, ''); renderPageSettings(); } }, 'Clear') : null))),
      h('div', { class: 'settings-group' }, h('h2', null, 'Custom code'),
        h('p', { class: 'hint' }, 'Head and body code is applied after local publishing.'),
        textField('Inside <head>', 'headCode', { multi: true, rows: 6 }),
        textField('Before </body>', 'bodyCode', { multi: true, rows: 6 }))
    ];
    $('ed').replaceChildren(h('div', { class: 'settings-view' },
      h('h1', null, 'Page settings'), ...groups,
      h('button', { class: 'btn sm ghost', type: 'button', onclick: async () => {
        try {
          const history = await api('history');
          modal(h('div', null, h('h2', null, 'Version history'),
            ...history.map(item => h('p', { class: 'hint' }, `${item.id} · ${new Date(item.at).toLocaleString('uk-UA')}`)),
            h('div', { class: 'mod-f' }, h('button', { class: 'btn', onclick: closeModal }, 'Close'))));
        } catch (error) { toast(error.message, true); }
      } }, 'Version history')));
  }

  /* Publish modal */
  $('bPub').addEventListener('click', () => {
    const msg = h('input', { type: 'text', placeholder: 'What changed? (optional)' });
    modal(h('div', null,
      h('h2', null, 'Publish changes locally?'),
      h('p', { class: 'hint' }, 'Changes will appear on the local site after refresh.'),
      h('div', { class: 'f', style: 'margin-top:16px;' },
        h('span', { class: 'cap' }, 'Comment'),
        msg
      ),
      h('div', { class: 'mod-f' },
        h('button', { class: 'btn', onclick: closeModal }, 'Cancel'),
        h('button', {
          class: 'cta',
          onclick: () => doPublish(msg.value)
        }, h('span', { class: 'cl' }, 'Publish now'))
      )
    ));
  });

  async function doPublish(message) {
    const steps = h('div', { class: 'steps' },
      h('div', null, h('i'), 'Saving to local project'),
      h('div', null, h('i'), 'Done')
    );
    const mark = (k, state) => {
      steps.children[k].className = state === 'ok' ? 'ok' : 'on';
    };
    modal(h('div', null,
      h('h2', null, 'Publishing…'),
      steps,
      h('div', { class: 'mod-f' })
    ));
    mark(0, 'on');

    try {
      for (const setting of Object.values(S.c.linkSettings || {})) {
        if (!['page', 'section'].includes(setting.type)) continue;
        const page = S.pages.find(page => page.id === setting.pageId);
        if (!page) throw new Error('Choose an existing page for every automatic link');
        if (setting.type === 'section') {
          const sections = await pageSections(page);
          if (!sections.some(section => section.id === setting.sectionId)) throw new Error(`Choose an existing section on ${page.title}`);
        }
      }
      await saveDraftNow();
      const res = await api('publish', { expectedDraftRevision: S.draftRevision, message });
      mark(0, 'ok');
      mark(1, 'on');
      S.pub = clone(S.c);
      S.sha = res.sha;
      S.draftRevision = null;
      status();
      mark(1, 'ok');
      $('modC').querySelector('.mod-f').replaceChildren(
        h('button', { class: 'btn accent', onclick: () => { closeModal(); $('pvF').src = S.page + '?cms-preview=1&v=' + Date.now(); } }, 'Done')
      );
    } catch (err) {
      closeModal();
      toast('Publish failed: ' + err.message, true);
    }
  }

  function modal(node) {
    $('modC').style.width = '';
    $('modC').replaceChildren(node);
    $('mod').hidden = false;
  }
  function closeModal() {
    $('mod').hidden = true;
    $('modC').replaceChildren();
  }
  $('mod').addEventListener('mousedown', e => { if (e.target === $('mod')) closeModal(); });

  /* Auth & Load */
  $('pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('lgErr').textContent = '';
    const f = new FormData(e.target);
    try {
      const r = await api('login', { user: f.get('user'), password: f.get('password') });
      S.me = r.user;
      await initApp();
    } catch (err) {
      $('lgErr').textContent = err.message;
    }
  });

  $('bOut').addEventListener('click', async () => {
    if (confirm('Log out of the editor?')) {
      await api('logout');
      location.reload();
    }
  });

  async function initApp() {
    $('login').hidden = true;
    $('app').hidden = false;

    const me = await api('me').catch(() => ({ ready: true }));
    if (!me.ready) {
      $('tokenWarn').style.display = 'flex';
    } else {
      $('tokenWarn').style.display = 'none';
    }

    let r;
    try {
      r = await api('content');
      if (!r.published?.content || typeof r.published.content !== 'object') {
        throw new Error('Published content was not returned. Restart the local CMS and refresh.');
      }
    } catch (err) {
      $('st').lastChild.textContent = 'Could not load content';
      $('st').classList.add('dirty');
      $('ed').replaceChildren(h('div', { class: 'plate' }, h('h2', null, 'Could not load fields'), h('p', null, err.message)));
      return;
    }
    S.pub = r.published.content;
    S.sha = r.published.sha;
    S.draftRevision = r.draftRevision;
    S.c = clone(r.draft || S.pub);
    try {
      const result = await api('pages-list');
      S.pages = result.pages || [];
    } catch (error) {
      S.pages = [{ id: 'route:index.astro', path: '/', title: 'Home', kind: 'static' }];
      toast('Page list: ' + error.message, true);
    }
    $('pageSelect').replaceChildren(...S.pages.map(page => h('option', { value: page.path }, `${page.title} · ${page.path}`)));
    $('pageSelect').value = S.page;
    $('pageUrl').textContent = location.origin + S.page;
    $('pvOpen').href = S.page;

    // Check local draft
    try {
      const local = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!r.draft && local && local.c && !same(strip(local.c), strip(S.pub))) {
        if (confirm('Unsaved drafts were found in this browser. Restore them?')) {
          S.c = local.c;
        }
      }
    } catch (e) {}

    // Rebase older local drafts onto the selected canonical phone Const.
    let migratedConst = false;
    const legacyContent = !S.c.consts;
    const migrateLegacyPhone = !S.c.consts?.companyPhone || Boolean(S.c.consts?.headerPhone || S.c.consts?.footerPhone);
    if (!S.c.consts) { S.c.consts = clone(S.pub.consts || {}); migratedConst = true; }
    const canonicalPhone = S.pub.consts?.companyPhone;
    if (canonicalPhone && !S.c.consts.companyPhone) {
      S.c.consts.companyPhone = clone(canonicalPhone); migratedConst = true;
    }
    const replaceOldPhoneRefs = value => {
      if (Array.isArray(value)) { value.forEach(replaceOldPhoneRefs); return; }
      if (!value || typeof value !== 'object') return;
      for (const [key, item] of Object.entries(value)) {
        if (key === 'consts') continue;
        const ref = constRef(item);
        if (ref && ['headerPhone', 'footerPhone'].includes(ref.key)) {
          value[key] = constToken('companyPhone', ref.format); migratedConst = true;
        } else replaceOldPhoneRefs(item);
      }
    };
    if (canonicalPhone && migrateLegacyPhone) {
      replaceOldPhoneRefs(S.c);
      for (const key of ['headerPhone', 'footerPhone']) {
        if (key in S.c.consts) { delete S.c.consts[key]; migratedConst = true; }
      }
      const phone = constToken('companyPhone');
      const phoneHref = constToken('companyPhone', 'tel');
      if (S.c.sections?.headerNav) {
        if (S.c.sections.headerNav.phone !== phone) { S.c.sections.headerNav.phone = phone; migratedConst = true; }
        if (S.c.sections.headerNav.phoneHref !== phoneHref) { S.c.sections.headerNav.phoneHref = phoneHref; migratedConst = true; }
      }
      if (S.c.contacts) {
        if (S.c.contacts.phone !== phone) { S.c.contacts.phone = phone; migratedConst = true; }
        if (S.c.contacts.phoneHref !== phoneHref) { S.c.contacts.phoneHref = phoneHref; migratedConst = true; }
      }
    }
    const legacyBindings = [
      [S.c.contacts, 'email', S.c.consts?.email?.value, constToken('email')],
      [S.c.contacts, 'emailHref', 'mailto:ALMStudio@gmail.com', constToken('email', 'mailto')],
      [S.c.contacts, 'serviceArea', S.c.consts?.serviceArea?.value, constToken('serviceArea')]
    ];
    for (const [owner, key, oldValue, token] of legacyBindings) {
      if (legacyContent && owner && typeof oldValue === 'string' && owner[key] === oldValue) { owner[key] = token; migratedConst = true; }
    }
    if (legacyContent && S.c.contacts && constRef(S.c.contacts.email)?.key === 'email' && !S.c.contacts.emailHref) {
      S.c.contacts.emailHref = constToken('email', 'mailto'); migratedConst = true;
    }
    if (migratedConst) changed();

    if (S.mode === 'const') renderConst(); else render();
    fitPreview();
    preview();
    if (location.hash === '#media') setMode('media');
    if (location.hash === '#const') setMode('const');
  }

  (async () => {
    try {
      const me = await api('me');
      if (me.user) {
        S.me = me.user;
        await initApp();
      }
    } catch (e) {
      console.log('Not logged in:', e);
    }
  })();
})();
</script>
</body>
</html>
