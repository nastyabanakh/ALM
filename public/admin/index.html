<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ALM · Site editor</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/admin/admin-ui.css">
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="login" class="login">
  <div class="lg-box">
    <div class="lg-logo">ALM<span>.</span></div>
    <div class="lg-sub">Your content, all in one place.</div>
    <form id="pwForm" class="lg-f">
      <div class="f">
        <label class="cap" for="loginUser">Username</label>
        <input type="text" id="loginUser" name="user" required autocomplete="username" placeholder="admin" autofocus>
      </div>
      <div class="f">
        <label class="cap" for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn accent" style="height:var(--ui-control-lg);margin-top:var(--ui-space-4)">Sign in</button>
      <div id="lgErr" class="lg-err" role="alert"></div>
    </form>
    <div id="lgSetup" class="hint" style="margin-top:var(--ui-space-7);">
      Set your local username and password in <code>.env.local</code>.
    </div>
  </div>
</div>

<!-- 2. MAIN APP -->
<div id="app" hidden>
  <aside class="mode-rail" aria-label="Workspace navigation">
    <div class="rail-logo" aria-label="ALM">A</div>
    <button id="modeAdmin" class="on" type="button" title="Page editor" aria-label="Page editor"><span class="ui-icon" data-icon="panels-top-left"></span></button>
    <button id="modeCms" type="button" title="CMS collections" aria-label="CMS collections"><span class="ui-icon" data-icon="database"></span></button>
    <button id="modeMedia" type="button" title="Media library" aria-label="Media library"><span class="ui-icon" data-icon="images"></span></button>
    <button id="modeConst" type="button" title="Const" aria-label="Const"><span class="ui-icon" data-icon="variable"></span></button>
    <button id="modeSettings" type="button" title="Page settings" aria-label="Page settings"><span class="ui-icon" data-icon="settings-2"></span></button>
    <button id="bOut" class="rail-logout" type="button" title="Log out" aria-label="Log out"><span class="ui-icon" data-icon="log-out"></span></button>
  </aside>
  <div class="app-main">
  <header class="top">
    <div class="project-identity"><span class="project-mark">A</span><span class="project-name">ALM</span><span class="project-divider">/</span></div><div class="top-title">Page editor</div>
    <div class="acts"><button id="compactPreview" class="icon-btn" type="button" aria-label="Show preview" title="Show preview" aria-pressed="false"><span class="ui-icon" data-icon="monitor"></span></button>
      <div id="st" class="st" role="status" aria-live="polite" aria-atomic="true"><i aria-hidden="true"></i><span aria-label="Loading"><span class="ui-loading-squares" aria-hidden="true"><i class="ui-loading-square"></i><i class="ui-loading-square"></i><i class="ui-loading-square"></i><i class="ui-loading-square"></i><i class="ui-loading-square"></i></span></span></div>
      <div class="history-actions"><button id="undo" class="icon-btn" type="button" title="Undo (Ctrl/Cmd+Z)" aria-label="Undo"><span class="ui-icon" data-icon="undo-2"></span></button><button id="redo" class="icon-btn" type="button" title="Redo (Ctrl/Cmd+Shift+Z)" aria-label="Redo"><span class="ui-icon" data-icon="redo-2"></span></button></div>
      <button id="bPub" class="cta" disabled>
        <span class="cl">Publish</span>
      </button>
    </div>
  </header>
  <div id="tokenWarn" style="display:none;background:var(--ui-color-raised);color:var(--ui-color-text);padding:var(--ui-space-5) var(--ui-space-9);font-size:var(--ui-font-md);border-bottom:1rem solid var(--ui-color-border-strong);align-items:center;gap:var(--ui-space-5);">
    <span>Remote publishing is not configured. Edit static content locally with <code>npm run dev:cms</code>.</span>
  </div>
  <main id="adminWorkspace" class="wrap">
    <aside id="cmsCatalog" class="cms-catalog" hidden></aside>
    <section id="cmsRecords" class="cms-records" hidden></section>
    <div id="cmsListResizer" class="pane-resizer cms-list-resizer" role="separator" aria-orientation="vertical" aria-label="CMS list width" tabindex="0" hidden></div>
    <!-- Editor Column -->
    <div id="ed" class="ed"></div>
    <div id="paneResizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="Editor width" tabindex="0"></div>

    <!-- Live Preview Column -->
    <div class="pv">
      <div class="canvas-toolbar">
      <div class="pv-address"><div class="page-select"><span class="ui-icon" data-icon="file"></span><select id="pageSelect" aria-label="Choose page"></select><span class="ui-icon page-select-chevron" data-icon="chevron-down"></span></div></div><code id="pageUrl" class="page-url">http://127.0.0.1:3001/</code><div class="pv-bar"><button id="pvRe" class="icon-btn" type="button" title="Reload preview" aria-label="Reload preview"><span class="ui-icon" data-icon="rotate-cw"></span></button><a id="pvOpen" href="/" target="_blank" class="icon-btn" title="Open page" aria-label="Open page"><span class="ui-icon" data-icon="external-link"></span></a>
        <div id="dev" class="seg">
          <button type="button" class="on" data-d="desk" title="Desktop" aria-label="Desktop"><span class="ui-icon" data-icon="monitor"></span></button>
          <button type="button" data-d="tab" title="Tablet" aria-label="Tablet"><span class="ui-icon" data-icon="tablet"></span></button>
          <button type="button" data-d="ph" title="Phone" aria-label="Phone"><span class="ui-icon" data-icon="smartphone"></span></button>
        </div>
        <button id="pvClicks" type="button" class="icon-btn active" aria-pressed="true" title="Preview links disabled" aria-label="Toggle preview links"><span class="ui-icon" data-icon="mouse-pointer-click"></span></button>
      </div>
      </div>
      <nav id="sectionBar" class="section-bar" aria-label="Page sections"><div id="tabs" class="tabs" role="tablist"></div></nav>
      <div id="pvBox" class="pv-box">
        <iframe id="pvF" src="/?cms-preview=1" title="Draft preview"></iframe>
      </div>
      <div id="editorBreadcrumbs"></div>
    </div>
  </main>
  <div id="workspaceView" class="workspace-view" hidden></div>
  </div>
</div>

<!-- Modal Container -->
<div id="mod" class="mod" hidden>
  <div id="modC" class="mod-c"></div>
</div>

<!-- Toast -->
<div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>

<script src="/admin/content-structure.js"></script>
<script src="/admin/cms-workspace.js"></script>
<script type="module">
import { h, pageURLLink, itemHeader, publishedToggle, activeStatusField, icon as uiIcon, sidebar, disclosure, emptyState, badge, button as uiButton, createToast, createModalController, quickFind, componentIcon as sharedComponentIcon, elementCard as sharedElementCard, breadcrumbs, backAction, groupFooter, compactSearch, loading, targetToggle, folderTree, openGroupDialog } from "/admin/ui-components.mjs";
import * as Components from "/admin/component-model.mjs";
import {collectionDesigner} from '/admin/cms-schema-editor.mjs';
import {collectionSchema,inferFields,getPath,putPath,valueIssue,pageFields} from '/admin/cms-schema-model.mjs';
import {groupedProperties,propertyControl} from '/admin/cms-properties.mjs';
import {duplicateAction,duplicateDialog} from '/admin/ui-components.mjs';
import {constPickerList} from '/admin/ui-components.mjs';
import {installCMSLayout} from '/admin/cms-layout.mjs';
import {openGraphEditor} from '/admin/open-graph-editor.mjs';
import {dateControl} from '/admin/date-control.mjs';
import {slugify,uniqueSlug} from '/cms/slug.mjs';
import {documentText} from '/admin/rich-text-model.mjs';
import {cmsCatalogView,cmsRecordsView} from '/admin/cms-manager.mjs';
import {collectionListView,collectionItemView} from '/admin/collection-views.mjs';
import {startSortable} from '/admin/sortable.mjs';
import {constGroups, moveConst, constBrowser} from '/admin/const-browser.mjs';
import * as ConstTokens from "/admin/const-tokens.mjs";
import { inlineConstEditor } from "/admin/inline-const-editor.mjs";
(() => {
  const $ = id => document.getElementById(id);
  document.querySelectorAll('[data-icon]').forEach(el => el.style.setProperty('--icon', `url('/admin/icons/${el.dataset.icon}.svg')`));
  document.querySelector('.mode-rail').replaceWith(sidebar());
  const clone = o => JSON.parse(JSON.stringify(o));
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  const toast = createToast($('toast'));

  /* API Client */
  async function api(op, body = {}) {
    if (['media-update', 'media-move-selection', 'media-folder-rename', 'media-stash', 'media-trash-selection', 'media-folder-trash', 'media-draft-discard'].includes(op) && S.c) await saveDraftNow();
    if (op.startsWith('media-') || op === 'publish') body = { ...body, expectedMediaRevision: Object.hasOwn(body,'expectedMediaRevision')?body.expectedMediaRevision:S.media?.mediaRevision ?? null };
    const isGet = ['content', 'history', 'manifest', 'me', 'media-list', 'pages-list', 'project-status'].includes(op);
    const url = '/api/admin?op=' + encodeURIComponent(op);
    const opts = {
      method: isGet ? 'GET' : 'POST',
      headers: { 'Content-Type': 'application/json' }
    };
    if (!isGet) opts.body = JSON.stringify(body);
    let res;
    for (let attempt = 0; ; attempt++) {
      try { res = await fetch(url, opts); if (!isGet || ![502,503,504].includes(res.status) || attempt === 5) break; }
      catch(error) { if (!isGet || attempt === 5) throw error; }
      await new Promise(resolve => setTimeout(resolve, Math.min(150 * 2 ** attempt, 1200)));
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const fields = Array.isArray(data.details)
        ? data.details.slice(0, 3).map(item => `${item.path.join('.')}: ${item.message}`).join('; ')
        : '';
      throw new Error(fields || data.message || 'Request failed: ' + res.status);
    }
    if (data.mediaDraft) {
      recordAction({ kind: 'media-draft', position: data.mediaState.historyPosition });
      S.media = data.mediaState; status(); updateHistoryButtons();
    }
    if (data.siteState) {
      const state = data.siteState, mapping = data.filesystem?.pathMappings || {};
      const mappingKeys = Object.keys(mapping).sort((a,b) => b.length-a.length);
      const mappingPattern = mappingKeys.length ? new RegExp(mappingKeys.map(key => key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g') : null;
      const remap = value => {
        if (typeof value === 'string') {
          return mappingPattern ? value.replace(mappingPattern, match => mapping[match]) : value;
        }
        if (Array.isArray(value)) { for (let i=0;i<value.length;i++) value[i]=remap(value[i]); }
        else if (value && typeof value === 'object') for (const key of Object.keys(value)) value[key]=remap(value[key]);
        return value;
      };
      remap(history.undo); remap(history.redo);
      S.selectedAsset = remap(S.selectedAsset); S.mediaFolder = remap(S.mediaFolder + '/').replace(/\/$/, '');
      S.mediaSelection = new Set([...S.mediaSelection].map(remap));
      S.pub = state.published.content; S.c = state.draft || clone(S.pub); S.sha = state.published.sha; S.draftRevision = state.draftRevision;
      preview(); status();
      $('pvF').src = S.page + '?cms-preview=1&v=' + Date.now();
    }
    if (op === 'project-status') { S.entryConstUsage = data.constUsage || {}; S.entryRevisions = data.entries.filter(entry=>entry.collection!=='pages').map(entry => [entry.collection,entry.id,entry.revision]).sort(); persistHistorySoon(); }
    return data;
  }

  /* State */
  const S = {
    me: '',
    projectPending: false,
    sha: '',
    draftRevision: null,
    pub: null,
    c: null,
    tab: null,
    sections: [],
    activeField: null,
    activeGroup: null,
    editorCMS: null,
    editingMain: false,
    collectionKey: null,
    collectionItem: null,
    cmsTab: 'collections',
    mode: 'admin',
    media: null,
    mediaFolder: '/assets',
    selectedAsset: null,
    mediaSelection: new Set(),
    mediaSearch: '',
    mediaSelectionAnchor: null,
    constKey: null,
    page: '/',
    pages: [],
    dev: 'desk',
    blockPreviewClicks: true
  };
  const LS = 'alm.admin.draft';
  const workspaceKey='alm.admin.workspace:'+location.pathname;
  let workspaceNavigationReady=false,workspaceSaveTimer=0;
  function saveWorkspaceView(){
    if(!workspaceNavigationReady||!S.c||!pageCMS)return;
    const snapshot=pageCMS.snapshot(),collection=cmsInlineCollection(),item=collection?.items[S.collectionItem];
    const view={version:1,mode:S.mode,page:S.page,section:S.tab,constKey:S.constKey,mediaFolder:S.mediaFolder,selectedAsset:S.selectedAsset,
      cms:S.mode==='cms'?{collection:snapshot.collection?{kind:'page',key:snapshot.collection}:{kind:'inline',key:S.collectionKey},entryId:snapshot.entry?.id||null,itemId:item?.id||null,itemIndex:S.collectionItem,itemTitle:item?CMSStructure.itemTitle(item,S.collectionItem):null,archivedId:S.cmsArchivedItem||null,filter:cmsFilterMode,search:cmsManagerSearch}:null,
      scroll:{editor:$('ed').scrollTop,records:$('cmsRecords').scrollTop,catalog:$('cmsCatalog').scrollTop}};
    try{localStorage.setItem(workspaceKey,JSON.stringify(view));}catch{}
  }
  function queueWorkspaceSave(){clearTimeout(workspaceSaveTimer);workspaceSaveTimer=setTimeout(saveWorkspaceView,120);}
  async function restoreWorkspaceView(){
    let view;try{view=JSON.parse(localStorage.getItem(workspaceKey)||'null');}catch{return;}
    if(view?.version!==1||!['admin','cms','media','const','settings'].includes(view.mode))return;
    const explicit={ '#cms':'cms','#media':'media','#const':'const','#settings':'settings'}[location.hash];if(explicit&&explicit!==view.mode)return;
    if(typeof view.page==='string'&&S.pages.some(page=>page.path===view.page)&&view.page!==S.page)await switchPage(view.page);
    if(typeof view.section==='string')S.tab=view.section;
    if(view.mode==='const'&&view.constKey&&S.c.consts?.[view.constKey]){S.constKey=view.constKey;S.openConstDetail=true;}
    if(view.mode==='media'){if(S.media?.folders.includes(view.mediaFolder))S.mediaFolder=view.mediaFolder;if(S.media?.assets.some(asset=>asset.url===view.selectedAsset))S.selectedAsset=view.selectedAsset;}
    await setMode(view.mode);
    if(view.mode==='cms'&&view.cms){
      const saved=view.cms;
      if(saved.collection?.kind==='page'&&['posts','projects'].includes(saved.collection.key))await pageCMS.restore(saved.collection.key,saved.entryId);
      else if(saved.collection?.kind==='inline'){
        const collection=CMSStructure.collections(S.c,S.sections).find(item=>item.key===saved.collection.key);
        if(collection){S.collectionKey=collection.key;cmsSelectionScope='content:'+collection.key;S.activeGroup=null;S.collectionItem=null;
          if(saved.archivedId&&(S.c.editorSettings?.archivedCollectionItems?.[collection.key]||[]).some(entry=>entry.id===saved.archivedId))S.cmsArchivedItem=saved.archivedId;
          else{S.cmsArchivedItem=null;let index=saved.itemId!=null?collection.items.findIndex(item=>String(item.id)===String(saved.itemId)):-1;
            if(index<0&&saved.itemId==null&&saved.itemTitle){const matches=collection.items.map((item,index)=>CMSStructure.itemTitle(item,index)===saved.itemTitle?index:-1).filter(index=>index>=0);if(matches.length===1)index=matches[0];}
            if(index>=0)S.collectionItem=index;
          }renderCollections();
        }
      }
      cmsFilterMode=['all','active','archive'].includes(saved.filter)?saved.filter:'all';cmsArchiveFilter=cmsFilterMode==='archive';cmsManagerSearch=typeof saved.search==='string'?saved.search:'';renderCMSChrome();
    }
    requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const [key,id]of [['editor','ed'],['records','cmsRecords'],['catalog','cmsCatalog']])if(Number.isFinite(view.scroll?.[key]))$(id).scrollTop=view.scroll[key];}));
  }
  document.addEventListener('scroll',event=>{if(['ed','cmsRecords','cmsCatalog'].includes(event.target.id))queueWorkspaceSave();},true);
  addEventListener('pagehide',saveWorkspaceView);addEventListener('beforeunload',saveWorkspaceView);
  const strip = c => { const o = clone(c); delete o.pub; return o; };
  const dirty = () => S.pub && S.c && !same(strip(S.c), strip(S.pub));
  const constRef = value => {
    const match = typeof value === 'string' && /^\{\{const\.([a-z][a-zA-Z0-9]*)(?:\|(tel|mailto))?\}\}$/.exec(value.trim());
    return match ? { key: match[1], format: match[2] || null } : null;
  };
  const constToken = (key, format) => `{{const.${key}${format ? `|${format}` : ''}}}`;
  const resolveConst = value => ConstTokens.resolve(value, S.c?.consts || {});

  function constUsage(key) {
    let count = S.entryConstUsage?.[key] || 0;
    const walk = value => {
      if (typeof value === 'string') count += ConstTokens.references(value).filter(ref => ref.key === key).length;
      else if (Array.isArray(value)) value.forEach(walk);
      else if (value && typeof value === 'object') Object.values(value).forEach(walk);
    };
    for (const [name, value] of Object.entries(S.c || {})) if (name !== 'consts') walk(value);
    return count;
  }
  const history = { undo: [], redo: [], key: '', at: 0, busy: false, ready: false };
  let historyQueued = false, historyWarning = false;
  const historyKey = () => LS + '.history.' + String(S.me || 'admin');
  function persistHistorySoon() {
    if (!history.ready || historyQueued || !S.sha || !S.c) return;
    historyQueued = true;
    queueMicrotask(() => {
      historyQueued = false;
      const snapshot = { version: 1, sha: S.sha, content: S.c, mediaRevision: S.media?.mediaRevision ?? null, entries: S.entryRevisions || [], undo: history.undo, redo: history.redo };
      try { localStorage.setItem(historyKey(), JSON.stringify(snapshot)); }
      catch { if (!historyWarning && history.undo.length) { historyWarning = true; toast('Browser storage is full. Undo history cannot survive a reload.', true); } }
    });
  }
  function restoreHistory(initialContent = S.c) {
    try {
      const saved = JSON.parse(localStorage.getItem(historyKey()) || 'null');
      if (saved?.version === 1 && saved.sha === S.sha && same(saved.content,initialContent) && saved.mediaRevision === (S.media?.mediaRevision ?? null) && same(saved.entries,S.entryRevisions || []) && Array.isArray(saved.undo) && Array.isArray(saved.redo)) {
        const fresh=history.undo; history.undo = [...saved.undo,...fresh].slice(-100); if(!fresh.length)history.redo = saved.redo;
      } else {
        localStorage.removeItem(historyKey());
        const earlier=Array.from({length:S.media?.historyPosition||0},(_,index)=>({kind:'media-draft',position:index+1}));history.undo.unshift(...earlier);
      }
    } catch { /* Storage may be unavailable; the active session still has Undo. */ }
    history.ready = true;
  }
  function updateHistoryButtons() {
    $('undo').disabled = !history.ready || history.busy || !history.undo.length;
    $('redo').disabled = !history.ready || history.busy || !history.redo.length;
    persistHistorySoon();
  }
  function recordSnapshot(key, snapshot) {
    const now = Date.now();
    if (key !== history.key || now - history.at > 850) {
      history.undo.push(snapshot); if (history.undo.length > 100) history.undo.shift();
    }
    history.key = key; history.at = now; history.redo.length = 0; updateHistoryButtons();
  }
  function recordChange(key) { if (S.c) recordSnapshot(key, { kind: 'content', content: clone(S.c) }); }
  function recordEntryChange(key, entry) { recordSnapshot(key, entry); }
  function recordMediaChange(url, before, after) {
    recordAction({ kind: 'media', url, before, after });
  }
  function recordAction(action) {
    if (S.media?.hasDraft && ['media','replace','upload','folder','delete','folder-delete','folder-rename','media-bulk-move','media-bulk-delete'].includes(action.kind)) { updateHistoryButtons(); return; }
    history.undo.push(action);
    if (history.undo.length > 100) history.undo.shift();
    history.redo.length = 0;
    history.key = '';
    updateHistoryButtons();
  }
  async function applyHistory(direction) {
    const source = history[direction];
    if (!history.ready || !source.length || !S.c || history.busy) return;
    history.busy = true;
    updateHistoryButtons();
    const target = direction === 'undo' ? history.redo : history.undo;
    const entry = source.at(-1);
    if (entry.kind === 'media-draft' || entry.kind === 'entry-content') {
      try {
        if (entry.kind === 'media-draft') {
          S.media = await api('media-draft-' + direction); await loadMedia(); source.pop(); target.push(entry);
          if (!S.media.folders.includes(S.mediaFolder)) S.mediaFolder = '/assets';
        } else {
          const inverse = await pageCMS.applyProjectHistory(entry); source.pop(); target.push(inverse);
        }
        history.key = '';
        if (S.mode === 'media') renderMedia(); else if (S.mode === 'cms') renderCollections(); else if (S.mode === 'const') renderConst(); else if (S.mode === 'settings') renderPageSettings(); else render();
        status(); preview(); toast(direction === 'undo' ? 'Change undone' : 'Change redone');
      } catch(error) { toast(error.message,true); }
      history.busy=false;updateHistoryButtons();return;
    }

    if (['media-bulk-move', 'media-bulk-delete'].includes(entry.kind)) {
      try {
        if (entry.kind === 'media-bulk-move') await api('media-move-selection', { assignments: direction === 'undo' ? entry.before : entry.after });
        else if (direction === 'undo') await api('media-restore-selection', { token: entry.token });
        else entry.token = (await api('media-trash-selection', { urls: entry.urls })).token;
        source.pop(); target.push(entry); S.mediaSelection.clear(); await loadMedia();
        if (S.mode === 'media') renderMedia();
        toast(direction === 'undo' ? 'Change undone' : 'Change redone');
      } catch (error) { toast(error.message, true); }
      history.busy = false; updateHistoryButtons(); return;
    }

    if (['delete', 'folder-delete', 'folder-rename'].includes(entry.kind)) {
      try {
        if (entry.kind === 'delete') {
          if (direction === 'undo') await api('media-unstash', { url: entry.url, token: entry.token, metadata: entry.metadata });
          else Object.assign(entry, await api('media-stash', { url: entry.url }));
        } else if (entry.kind === 'folder-delete') {
          if (direction === 'undo') await api('media-folder-restore', { token: entry.token });
          else entry.token = (await api('media-folder-trash', { folder: entry.folder })).token;
        } else await api('media-folder-rename', { folder: entry.folder, name: direction === 'undo' ? entry.before : entry.after });
        source.pop(); target.push(entry); await loadMedia();
        if (!S.media.folders.includes(S.mediaFolder)) S.mediaFolder = '/assets';
        if (S.mode === 'media') renderMedia();
        toast(direction === 'undo' ? 'Change undone' : 'Change redone');
      } catch (error) { toast(error.message, true); }
      history.busy = false; updateHistoryButtons(); return;
    }

    if (entry.kind === 'replace' || entry.kind === 'upload' || entry.kind === 'folder') {
      try {
        if (entry.kind === 'replace') {
          const result = await api('media-swap-backup', { url: entry.url, backup: entry.backup });
          entry.backup = result.backup;
        } else if (entry.kind === 'upload') {
          if (direction === 'undo') {
            const result = await api('media-stash', { url: entry.url });
            entry.token = result.token;
            entry.metadata = result.metadata;
          } else await api('media-unstash', { url: entry.url, token: entry.token, metadata: entry.metadata });
        } else if (direction === 'undo') await api('media-folder-remove', { folder: entry.folder });
        else await api('media-folder', { parent: entry.parent, name: entry.name });
        source.pop(); target.push(entry);
        await loadMedia();
        if (S.mode === 'media') renderMedia();
        preview();
        toast(direction === 'undo' ? 'Change undone' : 'Change redone');
      } catch (error) { toast(error.message, true); }
      history.busy = false;
      updateHistoryButtons();
      return;
    }
    if (entry.kind === 'media') {
      try {
        await api('media-update', { url: entry.url, ...(direction === 'undo' ? entry.before : entry.after) });
        source.pop(); target.push(entry);
        await loadMedia();

  /* Client-side image optimization: Canvas -> WebP compression */
  function processImage(file, max = 1600, quality = 0.85) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        if (w > max || h > max) {
          if (w > h) {
            h = Math.round((h * max) / w);
            w = max;
          } else {
            w = Math.round((w * max) / h);
            h = max;
          }
        }
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, w, h);
        cv.toBlob(blob => {
          if (!blob) return reject(new Error('Could not optimize image'));
          const reader = new FileReader();
          reader.onload = () => {
            const base64 = reader.result.split(',')[1];
            resolve({ base64, ext: 'webp' });
          };
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }, 'image/webp', quality);
      };
      img.onerror = () => reject(new Error('Could not open file'));
      img.src = URL.createObjectURL(file);
    });
  }

  function readFileBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.readAsDataURL(file);
    });
  }

  function replacementBase64(file, asset) {
    const extension = asset.url.split('.').at(-1).toLowerCase();
    if (extension === 'mp4') {
      if (file.type !== 'video/mp4') throw new Error('MP4 video required');
      return readFileBase64(file);
    }
    const mime = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' }[extension];
    if (!mime || !file.type.startsWith('image/')) throw new Error('This format cannot be replaced');
    return new Promise((resolve, reject) => {
      const image = new Image();
      const objectUrl = URL.createObjectURL(file);
      image.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          canvas.getContext('2d').drawImage(image, 0, 0);
          canvas.toBlob(async blob => {
            URL.revokeObjectURL(objectUrl);
            if (!blob) return reject(new Error('Could not prepare image'));
            try { resolve(await readFileBase64(blob)); } catch (error) { reject(error); }
          }, mime, .9);
        } catch (error) { URL.revokeObjectURL(objectUrl); reject(error); }
      };
      image.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Image could not be opened')); };
      image.src = objectUrl;
    });
  }

      h('div', { class: 'settings-group' }, h('h2', null, 'Open Graph'),
        textField('Social title', 'ogTitle'), textField('Social description', 'ogDescription', { multi: true }),
        h('div',{class:'auto-field'},h('span',{class:'cap'},'Social image'),openGraphEditor({value:image||'',alt:settings.ogImageAlt||'',onChange:media=>{writeField({source:'pageSetting',key:'ogImage'},media.url);writeField({source:'pageSetting',key:'ogImageAlt'},media.alt);},pickAsset:pickCMSAsset,uploadAsset:file=>uploadAsset(file,'/assets'),resolveMedia:url=>S.media?.assets.find(asset=>asset.url===url)?.previewUrl||resolveConst(url)}))),
      disclosure('Custom code', h('div',null,textField('Inside <head>', 'headCode', {multi:true,rows:6}),textField('Before </body>', 'bodyCode', {multi:true,rows:6})), {note:'Advanced'})
    ];
    $('ed').replaceChildren(h('div', { class: 'settings-view' },
      h('h1', null, 'Page settings'), h('div',{class:'settings-grid'},...groups.slice(0,3)), groups[3],
      h('button', { class: 'btn sm ghost', type: 'button', onclick: async () => {
        try {
          const history = await api('history');
          modal(h('div', null, h('h2', null, 'Version history'),
            ...history.map(item => h('p', { class: 'hint' }, `${item.id} · ${new Date(item.at).toLocaleString('uk-UA')}`)),
            h('div', { class: 'mod-f' }, h('button', { class: 'btn', onclick: closeModal }, 'Close'))));
        } catch (error) { toast(error.message, true); }
      } }, 'Version history')));
  }

  /* Publish modal */
  $('bPub').addEventListener('click',async()=>{
    if(modalBusy)return;
    modalBusy=true;
    // Focus the modal first: this commits focused fields and starts any async blur normalization.
    modal(h('div',null,h('h2',null,'Preparing publication…'),loading('Saving drafts…')));
    try{
      await flushCanvasEditing();await pageCMS.flush();await saveDraftNow();
      const summary=await api('project-status');
      summary.expectedDraftRevision=summary.entries.find(entry=>entry.collection==='pages')?.revision || null;
      S.projectPending=summary.entryChanges>0;
      modalBusy=false;showProjectPublish(summary);
    }catch(error){modalBusy=false;closeModal();toast(error.message,true);}
  });
  function showProjectPublish(summary) {
    const msg = h('input', { type: 'text', placeholder: 'What changed? (optional)' });
    modal(h('div', null,
      h('h2', null, 'Publish project changes?'),
      h('p', { class: 'hint' }, `${summary.entries.length} content drafts${summary.lifecycleChanges?' + '+summary.lifecycleChanges+' archive/delete changes':''}${summary.mediaPending ? ' + media changes' : ''}. Publish all project changes locally.`),
      h('div', { class: 'f', style: 'margin-top:var(--ui-space-7);' },
        h('span', { class: 'cap' }, 'Comment'),
        msg
      ),
      h('div', { class: 'mod-f' },
        h('button', { class: 'btn', onclick: closeModal }, 'Cancel'),
        h('button', {
          class: 'cta',
          onclick: () => doPublish(msg.value, summary)
        }, h('span', { class: 'cl' }, 'Publish now'))
      )
    ));
  }

  async function doPublish(message, summary) {
    if(modalBusy)return;
    const steps = h('div', { class: 'steps' },
      h('div', null, h('i'), 'Saving to local project'),
      h('div', null, h('i'), 'Done')
    );
    const mark = (k, state) => {
      steps.children[k].className = state === 'ok' ? 'ok' : 'on';
    };
    modal(h('div', null,
      h('h2', null, 'Publishing…'),
      steps,
      h('div', { class: 'mod-f' })
    ));
    mark(0, 'on');
    modalBusy = true;
    let committed = false;

    try {
      for (const setting of Object.values(S.c.linkSettings || {})) {
        if (!['page', 'section'].includes(setting.type)) continue;
        const page = S.pages.find(page => page.id === setting.pageId);
        if (!page) throw new Error('Choose an existing page for every automatic link');
        if (setting.type === 'section') {
          const sections = await pageSections(page);
          if (!sections.some(section => section.id === setting.sectionId)) throw new Error(`Choose an existing section on ${page.title}`);
        }
      }
      await pageCMS.flush();await saveChain;
      const res=await api('publish',{expectedDraftRevision:summary.expectedDraftRevision,expectedMediaRevision:summary.mediaRevision,expectedEntries:summary.entries,message});
      committed = true;
      mark(0, 'ok');
      mark(1, 'on');
      if (res.content) S.c = res.content;
      S.pub = clone(S.c); S.sha = res.sha;
      S.draftRevision = null; S.projectPending = false;
      history.undo.length = 0; history.redo.length = 0; history.key = '';
      S.mediaSelection.clear();
      if (res.mediaState) S.media = res.mediaState;
      clearTimeout(saveT);
      if (res.pages) S.pages = res.pages;
      S.entryRevisions = [];
      updateHistoryButtons(); status();
      // The commit is complete. A refresh failure must never be reported as a
      // failed publication, or encourage the user to submit the same changes twice.
      try {
        if (!res.mediaState) await loadMedia();
        await pageCMS.afterProjectPublish(res);
      } catch(error) { toast('Published. Refresh the editor to load the latest preview.', true); }
      if (S.mode === 'media') renderMedia();
      else if (S.mode === 'settings') renderPageSettings();
      else if (S.mode === 'const') renderConst();
      else if (S.mode === 'cms') renderCollections();
      else render();
      status(); preview();
      mark(1, 'ok');
      if (res.media?.error) $('modC').append(h('p', { class: 'hint' }, 'Content published. Media folders are still pending: ' + res.media.error));
      modalBusy = false;
      $('modC').querySelector('.mod-f').replaceChildren(
        h('button', { class: 'btn accent', onclick: () => { closeModal(); $('pvF').src = S.page + '?cms-preview=1&v=' + Date.now(); } }, 'Done')
      );
    } catch (err) {
      modalBusy = false; closeModal();
      toast(committed ? 'Published. Refresh the editor to load the latest state.' : 'Publish failed: ' + err.message, true);
    }
  }

  let modalBusy = false;
  const modals = createModalController({overlay:$('mod'),content:$('modC'),background:[$('app'),$('login')],isBusy:()=>modalBusy});
  function modal(node) { modals.open(node); }
  function closeModal() { modals.close(); }
  function openQuickFind() {
    if ($('app').hidden) return;
    const views=[['Page editor','panels-top-left','admin'],['CMS collections','database','cms'],['Media library','images','media'],['Const','variable','const'],['Page settings','settings-2','settings']];
    quickFind({open:modal,close:closeModal,items:[
      ...views.map(([label,icon,mode])=>({label,icon,group:'Workspace',run:()=>setMode(mode)})),
      ...(S.sections||[]).map(section=>({label:section.label,group:'Section',icon:'panels-top-left',run:async()=>{S.tab=section.id;S.activeGroup=null;await setMode('admin');$('pvF').contentWindow?.postMessage({type:'CMS_FOCUS_SECTION',id:section.id},location.origin);}})),
      {label:'UI Kit',icon:'swatch-book',group:'Design system',run:()=>window.open('/admin/ui-kit.html','_blank','noopener')}
    ]});
  }
  $('quickFind').onclick=openQuickFind;
  document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k') {event.preventDefault();if(!$('mod').hidden)closeModal();else openQuickFind();}});


  /* Auth & Load */
  $('pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('lgErr').textContent = '';
    const f = new FormData(e.target);
    try {
      const r = await api('login', { user: f.get('user'), password: f.get('password') });
      S.me = r.user;
      await initApp();
    } catch (err) {
      $('lgErr').textContent = err.message;
    }
  });

  $('bOut').addEventListener('click', async () => {
    if (confirm('Log out of the editor?')) {
      await api('logout');
      location.reload();
    }
  });

  async function initApp() {
    $('login').hidden = true;
    $('app').hidden = false; $('app').inert = true; $('app').setAttribute('aria-busy','true');

    const me = await api('me').catch(() => ({ ready: true }));
    if (!me.ready) {
      $('tokenWarn').style.display = 'flex';
    } else {
      $('tokenWarn').style.display = 'none';
    }

    let r;
    try {
      r = await api('content');
      if (!r.published?.content || typeof r.published.content !== 'object') {
        throw new Error('Published content was not returned. Restart the local CMS and refresh.');
      }
    } catch (err) {
      $('st').lastChild.textContent = 'Could not load content';
      $('st').classList.add('dirty');
      $('ed').replaceChildren(h('div', { class: 'plate' }, h('h2', null, 'Could not load fields'), h('p', null, err.message)));
      $('app').inert = false; $('app').removeAttribute('aria-busy');
      return;
    }
    S.pub = r.published.content;
    S.sha = r.published.sha;
    S.draftRevision = r.draftRevision;
    S.c = clone(r.draft || S.pub);
    try {
      const result = await api('pages-list');
      S.pages = result.pages || [];
    } catch (error) {
      S.pages = [{ id: 'route:index.astro', path: '/', title: 'Home', kind: 'static' }];
      toast('Page list: ' + error.message, true);
    }
    $('pageSelect').replaceChildren(...S.pages.map(page => h('option', { value: page.path }, `${page.title} · ${page.path}`)));
    $('pageSelect').value = S.page;
    $('pageUrl').textContent = location.origin + S.page;
    $('pvOpen').href = S.page;

    // Check local draft
    try {
      const local = JSON.parse(localStorage.getItem(LS) || 'null');
      if (!r.draft && local && local.c && !same(strip(local.c), strip(S.pub))) {
        if (confirm('Unsaved drafts were found in this browser. Restore them?')) {
          S.c = local.c;
        }
      }
    } catch (e) {}

    // Rebase older local drafts onto the selected canonical phone Const.
    let migratedConst = false;
    const legacyContent = !S.c.consts;
    const migrateLegacyPhone = !S.c.consts?.companyPhone || Boolean(S.c.consts?.headerPhone || S.c.consts?.footerPhone);
    if (!S.c.consts) { S.c.consts = clone(S.pub.consts || {}); migratedConst = true; }
    const canonicalPhone = S.pub.consts?.companyPhone;
    if (canonicalPhone && !S.c.consts.companyPhone) {
      S.c.consts.companyPhone = clone(canonicalPhone); migratedConst = true;
    }
    const replaceOldPhoneRefs = value => {
      if (Array.isArray(value)) { value.forEach(replaceOldPhoneRefs); return; }
      if (!value || typeof value !== 'object') return;
      for (const [key, item] of Object.entries(value)) {
        if (key === 'consts') continue;
        const ref = constRef(item);
        if (ref && ['headerPhone', 'footerPhone'].includes(ref.key)) {
          value[key] = constToken('companyPhone', ref.format); migratedConst = true;
        } else replaceOldPhoneRefs(item);
      }
    };
    if (canonicalPhone && migrateLegacyPhone) {
      replaceOldPhoneRefs(S.c);
      for (const key of ['headerPhone', 'footerPhone']) {
        if (key in S.c.consts) { delete S.c.consts[key]; migratedConst = true; }
      }
      const phone = constToken('companyPhone');
      const phoneHref = constToken('companyPhone', 'tel');
      if (S.c.sections?.headerNav) {
        if (S.c.sections.headerNav.phone !== phone) { S.c.sections.headerNav.phone = phone; migratedConst = true; }
        if (S.c.sections.headerNav.phoneHref !== phoneHref) { S.c.sections.headerNav.phoneHref = phoneHref; migratedConst = true; }
      }
      if (S.c.contacts) {
        if (S.c.contacts.phone !== phone) { S.c.contacts.phone = phone; migratedConst = true; }
        if (S.c.contacts.phoneHref !== phoneHref) { S.c.contacts.phoneHref = phoneHref; migratedConst = true; }
      }
    }
    const legacyBindings = [
      [S.c.contacts, 'email', S.c.consts?.email?.value, constToken('email')],
      [S.c.contacts, 'emailHref', 'mailto:ALMStudio@gmail.com', constToken('email', 'mailto')],
      [S.c.contacts, 'serviceArea', S.c.consts?.serviceArea?.value, constToken('serviceArea')]
    ];
    for (const [owner, key, oldValue, token] of legacyBindings) {
      if (legacyContent && owner && typeof oldValue === 'string' && owner[key] === oldValue) { owner[key] = token; migratedConst = true; }
    }
    if (legacyContent && S.c.contacts && constRef(S.c.contacts.email)?.key === 'email' && !S.c.contacts.emailHref) {
      S.c.contacts.emailHref = constToken('email', 'mailto'); migratedConst = true;
    }
    if (migratedConst) changed();

    if (S.mode === 'const') renderConst(); else render();
    fitPreview();
    preview();
    const initialContent=clone(S.c);
    if (location.hash === '#cms') await setMode('cms');
    if (location.hash === '#media') await setMode('media');
    if (location.hash === '#const') await setMode('const');
    if (location.hash === '#settings') await setMode('settings');
    try { const [,projectStatus] = await Promise.all([loadMedia(),api('project-status')]);S.projectPending=projectStatus.entryChanges>0;
      restoreHistory(initialContent);
      updateHistoryButtons(); status(); } catch(error) { history.ready = true; updateHistoryButtons(); toast(error.message,true); }
    try{await restoreWorkspaceView();}catch(error){toast('Could not reopen the last item: '+error.message,true);}finally{workspaceNavigationReady=true;saveWorkspaceView();$('app').inert=false;$('app').removeAttribute('aria-busy');}

  }

  (async () => {
    try {
      const me = await api('me');
      if (me.user) {
        S.me = me.user;
        await initApp();
      }
    } catch (e) {
      console.log('Not logged in:', e);
    }
  })();
})();
</script>
</body>
</html>
